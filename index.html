<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The In-Between</title>
<meta name="description" content="The In-Between — a new game, starting from its title screen.">
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<div id="title-screen">
  <!-- Placeholder background -- swap the gradient below for a real
       background-image once the actual art file is in the repo (an
       inline chat image can't be saved to disk directly; drop the file
       in as e.g. title-bg.jpg and point .bg at it here). -->
  <div class="bg"></div>
  <div class="scrim"></div>

  <div class="content">
    <h1 class="game-title">THE IN-BETWEEN</h1>

    <nav class="menu" id="menu-main">
      <button class="menu-btn" data-panel="start" id="btn-start">Start Game</button>
      <button class="menu-btn" data-panel="levels">Levels</button>
      <button class="menu-btn" data-panel="options">Options</button>
    </nav>
  </div>

  <div class="panel" data-panel-id="start" hidden>
    <h2>Start Game</h2>
    <p>Nothing to play yet — the first level is still being built.</p>
    <button class="back-btn">Back</button>
  </div>

  <div class="panel" data-panel-id="levels" hidden>
    <h2>Levels</h2>
    <p>Nothing built yet — check back soon.</p>
    <button class="back-btn">Back</button>
  </div>

  <div class="panel" data-panel-id="options" hidden>
    <h2>Options</h2>
    <label class="opt-row">Volume
      <input type="range" id="opt-volume" min="0" max="100" value="80">
    </label>
    <button class="back-btn">Back</button>
  </div>
</div>

<script>
  const menu = document.getElementById('menu-main');
  const panels = document.querySelectorAll('.panel');
  menu.addEventListener('click', (e) => {
    const btn = e.target.closest('.menu-btn');
    if (!btn) return;
    const id = btn.dataset.panel;
    menu.hidden = true;
    panels.forEach((p) => { p.hidden = p.dataset.panelId !== id; });
  });
  panels.forEach((p) => {
    p.querySelector('.back-btn').addEventListener('click', () => {
      p.hidden = true;
      menu.hidden = false;
    });
  });
</script>
</body>
</html>
